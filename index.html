<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./public/icon.png" type="image/png">
  <title>Nyx24</title>
</head>

<body>
  <div id="loader">
    <div class="wrapper">
      <div class="rings">
        <div class="ring ring1">
          <div class="ring ring2">
            <div class="ring ring3">
              <div class="ring ring4"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="yearSelector" class="hidden">
    <div id="years24" class="preview">
    </div>
    <div id="couple1" class="preview">
    </div>
    <div id="years25" class="preview">
      <div class="locked">
        <section class="countdown-container">

          <div class="days-container">
            <div class="days"></div>
            <div class="days-label">Dias</div>
          </div>

          <div class="hours-container">
            <div class="hours"></div>
            <div class="hours-label">Horas</div>
          </div>

          <div class="minutes-container">
            <div class="minutes"></div>
            <div class="minutes-label">Minutos</div>
          </div>

          <div class="seconds-container">
            <div class="seconds"></div>
            <div class="seconds-label">Segundos</div>
          </div>

        </section>
      </div>
    </div>
    <div id="couple2" class="preview">
      <div class="locked"><img src="./public/lock-icon.svg" alt="lock-icon"></div>
    </div>
    <div id="years26" class="preview">
      <div class="locked"><img src="./public/lock-icon.svg" alt="lock-icon"></div>
    </div>
    <div id="couple3" class="preview">
      <div class="locked"><img src="./public/lock-icon.svg" alt="lock-icon"></div>
    </div>
<!--     <div id="years27" class="preview">
      <div class="locked"><img src="./public/lock-icon.svg" alt="lock-icon"></div>
    </div>
    <div id="years28" class="preview">
      <div class="locked"><img src="./public/lock-icon.svg" alt="lock-icon"></div>
    </div> -->
  </div>

  <div id="year-24" class="hidden">
    <div id="preloader">
      <img src="./public/coffee.jpg">
      <img src="./public/terrace.jpg">
      <img src="./public/corean.jpg">
      <img src="./public/rooftop.jpg">
      <img src="./public/restroom.jpg">
      <img src="./public/dormitory.jpg">
      <img src="./public/garden.jpg">
      <img src="./public/cats/cat-1.jpg">
      <img src="./public/cats/cat-2.jpg">
      <img src="./public/cats/cat-3.jpg">
      <img src="./public/cats/cat-4.jpg">
      <img src="./public/cats/cat-5.jpg">
      <img src="./public/cats/cat-6.jpg">
      <img src="./public/cats/cat-7.jpg">
      <img src="./public/cats/cat-8.jpg">
      <img src="./public/cats/cat-9.jpg">
      <img src="./public/cats/cat-10.jpg">
      <img src="./public/cats/cat-11.jpg">
      <img src="./public/cats/cat-12.jpg">
    </div>
    <div class="dialog-container">
      <div class="circle"></div>
      <div class="dialog-scene black-background">
        <button id="card-button" class="hidden">CARD</button>
        <div class="card-container hidden">
          <div id="card-1" class="card">
            <div class="card-top"></div>
            <div class="card-middle"></div>
            <div class="card-bottom">
            </div>
            <div class="card-back"></div>
          </div>
        </div>
        <div class="dialog-box left-dialog-box">
          <div class="dialog-content">
            <div class="text-container">
              <div class="text"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="year-25" class="hidden">
    <div class="dialog-container">
      <div class="circle"></div>
      <div class="dialog-scene cat-1-background">
        <button id="card-button" class="hidden">CARD</button>
        <div class="card-container hidden">
          <div id="card-1" class="card">
            <div class="card-top"></div>
            <div class="card-middle"></div>
            <div class="card-bottom">
            </div>
            <div class="card-back"></div>
          </div>
        </div>
        <div class="dialog-box left-dialog-box">
          <div class="dialog-content">
            <div class="text-container">
              <div class="text"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js" type="module"></script>
</body>

</html>
